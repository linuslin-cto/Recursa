[workspace]
resolver = "2"
members = [
    "crates/recursa-core",
    "crates/recursa-demo",
    "crates/recursa-cli",
]
default-members = ["crates/recursa-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Recursa"]

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
recursa-core = { path = "crates/recursa-core" }
recursa-demo = { path = "crates/recursa-demo" }
indexmap = { version = "2", features = ["serde"] }
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tempfile = "3"
thiserror = "2"
walkdir = "2"
